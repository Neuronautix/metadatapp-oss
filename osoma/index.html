<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metadatapp</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore the original URL saved by public/404.html during a GitHub Pages SPA redirect.
      var redirect = sessionStorage.getItem('ghpages_redirect');
      sessionStorage.removeItem('ghpages_redirect');
      if (redirect && redirect !== location.href) {
        history.replaceState(null, null, redirect);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

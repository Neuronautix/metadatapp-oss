include:
    - docker-compose.worker.yml

volumes:
    postgres-data: {}
    keycloak-postgres-data: {}
    osoma-node-modules: {}

services:
    router:
        build: services/router
        volumes:
            - "/var/run/docker.sock:/var/run/docker.sock"
            - "./services/router/certs:/etc/ssl/certs"
        ports:
            - "80:80"
            - "443:443"
        networks:
            - default
        profiles:
            - default

    api:
        build:
            context: services/php
            target: api
            args:
                USER_ID: ${USER_ID}
        environment:
            SERVER_NAME: ${PROJECT_ROOT_DOMAIN}
            UID: ${USER_ID}
            MERCURE_PUBLISHER_JWT_KEY: metadatapp-local-mercure-key
            MERCURE_SUBSCRIBER_JWT_KEY: metadatapp-local-mercure-key
            MERCURE_URL: http://api/.well-known/mercure
            MERCURE_PUBLIC_URL: https://${PROJECT_ROOT_DOMAIN}/.well-known/mercure
            OIDC_SERVER_URL: https://auth.${PROJECT_ROOT_DOMAIN}/realms/demo
            OIDC_SERVER_URL_INTERNAL: http://keycloak:8080/realms/demo
        depends_on:
            database:
                condition: service_healthy
            keycloak:
                condition: service_started
        volumes:
            - "${PROJECT_HOST_ROOT:-../..}:/var/www:cached"
        profiles:
            - default
        labels:
            - "project-name=${PROJECT_NAME}"
            - "traefik.enable=true"
            - "traefik.http.routers.${PROJECT_NAME}-api.rule=Host(`${PROJECT_ROOT_DOMAIN}`)"
            - "traefik.http.routers.${PROJECT_NAME}-api.tls=true"
            - "traefik.http.services.${PROJECT_NAME}-api.loadbalancer.server.port=80"

    osoma:
        build:
            context: services/osoma
            target: preview
        environment:
            VITE_PROXY_API_TARGET: http://api
            VITE_DATA_MODE: real
            VITE_AUTH_MODE: real
            VITE_OIDC_CLIENT_ID: osoma
            VITE_OIDC_SERVER_URL: https://auth.${PROJECT_ROOT_DOMAIN}/realms/demo
            VITE_OIDC_SERVER_URL_INTERNAL: https://auth.${PROJECT_ROOT_DOMAIN}/realms/demo
            CI: "true"
        depends_on:
            - api
        volumes:
            - "${PROJECT_HOST_ROOT:-../..}/osoma:/srv/app:cached"
            - "osoma-node-modules:/srv/app/node_modules"
        healthcheck:
            test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4173 || exit 1" ]
            interval: 5s
            timeout: 3s
            retries: 30
            start_period: 20s
        profiles:
            - default
        labels:
            - "project-name=${PROJECT_NAME}"
            - "traefik.enable=true"
            - "traefik.http.routers.${PROJECT_NAME}-osoma.rule=Host(`osoma.${PROJECT_ROOT_DOMAIN}`)"
            - "traefik.http.routers.${PROJECT_NAME}-osoma.tls=true"
            - "traefik.http.services.${PROJECT_NAME}-osoma.loadbalancer.server.port=4173"

    database:
        image: postgres:16
        environment:
            - POSTGRES_USER=app
            - POSTGRES_PASSWORD=app
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U app" ]
            interval: 5s
            timeout: 5s
            retries: 5
        profiles:
            - default

    keycloak-database:
        image: postgres:16
        environment:
            - POSTGRES_USER=keycloak
            - POSTGRES_PASSWORD=keycloak
            - POSTGRES_DB=keycloak
        volumes:
            - keycloak-postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U keycloak" ]
            interval: 5s
            timeout: 5s
            retries: 5
        profiles:
            - default

    keycloak:
        build:
            context: services/keycloak
            target: keycloak
        environment:
            KEYCLOAK_DATABASE_HOST: keycloak-database
            KEYCLOAK_DATABASE_NAME: keycloak
            KEYCLOAK_DATABASE_USER: keycloak
            KEYCLOAK_DATABASE_PASSWORD: keycloak
            KEYCLOAK_ADMIN_USER: admin
            KEYCLOAK_ADMIN_PASSWORD: admin
            KEYCLOAK_HTTP_RELATIVE_PATH: /
            KC_HOSTNAME_URL: https://auth.${PROJECT_ROOT_DOMAIN}/
            KC_HOSTNAME_ADMIN_URL: https://auth.${PROJECT_ROOT_DOMAIN}/
            KC_FEATURES: "scripts"
        depends_on:
            keycloak-database:
                condition: service_healthy
        volumes:
            - ./services/keycloak/themes/api-platform-demo:/opt/bitnami/keycloak/themes/api-platform-demo:ro
            # owner-policy.jar is baked into the image via COPY in services/keycloak/Dockerfile
            # Single-file bind mounts over existing image paths fail on WSL2/Docker Desktop
        profiles:
            - default
        labels:
            - "project-name=${PROJECT_NAME}"
            - "traefik.enable=true"
            - "traefik.http.routers.${PROJECT_NAME}-keycloak.rule=Host(`auth.${PROJECT_ROOT_DOMAIN}`)"
            - "traefik.http.routers.${PROJECT_NAME}-keycloak.tls=true"
            - "traefik.http.services.${PROJECT_NAME}-keycloak.loadbalancer.server.port=8080"

    keycloak-config-cli:
        image: bitnamilegacy/keycloak-config-cli:5-debian-12
        depends_on:
            - keycloak
        environment:
            KEYCLOAK_URL: http://keycloak:8080/
            KEYCLOAK_USER: admin
            KEYCLOAK_PASSWORD: admin
            KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
            KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
            IMPORT_FILES_LOCATIONS: "/config/*"
        volumes:
            - ./services/keycloak/config:/config:ro
        profiles:
            - default

# this is a template to factorize the service definitions
x-services-templates:
    worker_base: &worker_base
        build:
            context: services/php
            target: worker
            args:
                USER_ID: ${USER_ID}
        # Don't use depends_on, it does not work well with docker compose profiles
        volumes:
            - "${PROJECT_HOST_ROOT:-../..}:/var/www:cached"
        profiles:
            - worker
        healthcheck:
            test: "cat /proc/1/status"
            interval: 3s
            start_period: 1s

services:
    worker_messenger:
        <<: *worker_base
        command: php -d memory_limit=1G /var/www/api/bin/console messenger:consume async --memory-limit=128M -vv
        environment:
            - MERCURE_URL=http://frontend/.well-known/mercure
            - MERCURE_PUBLISHER_JWT_KEY=metadatapp-local-mercure-key
            - MERCURE_SUBSCRIBER_JWT_KEY=metadatapp-local-mercure-key
            - MERCURE_PUBLIC_URL=https://${PROJECT_ROOT_DOMAIN}/.well-known/mercure

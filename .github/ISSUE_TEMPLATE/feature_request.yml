name: Feature Request
description: Suggest an idea or enhancement for Metadatapp.
labels: [ "enhancement", "triage" ]
body:
  - type: textarea
    id: business-value
    attributes:
      label: Business Value
      description: "Why is this feature needed? Is it related to a problem? Please describe."
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: "A clear and concise description of what you want to happen."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: "A clear and concise description of any alternative solutions or features you've considered."
    validations:
      required: false
  - type: dropdown
    id: domain
    attributes:
      label: Primary Domain
      description: "Which domain would this feature belong to?"
      options:
        - "Backend (API/Database)"
        - "Frontend (Osoma UI)"
        - "Infrastructure (DevOps/Docker)"
    validations:
      required: true

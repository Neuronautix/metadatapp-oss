name: "Clean-clone smoke test"

# Verifies that a fresh checkout of the public repository can install
# dependencies and complete the lightweight QA gates that do not require
# repository secrets, a database, or external services. Kept intentionally
# minimal so contributors on forks see a green pipeline on every PR.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: "Bootstrap from a fresh clone"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: osoma/pnpm-lock.yaml

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: "Validate top-level documentation files exist"
        run: |
          for file in \
            README.md \
            LICENSE \
            CONTRIBUTING.md \
            CODE_OF_CONDUCT.md \
            SECURITY.md \
            SUPPORT.md \
            GOVERNANCE.md \
            AGENTS.md; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::Missing required public-readiness document"
              exit 1
            fi
          done

      - name: "Validate composer manifest"
        working-directory: api
        run: composer validate --no-check-publish --no-interaction

      - name: "Install backend dev dependencies"
        working-directory: api
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: "PHP lint backend sources"
        working-directory: api
        run: |
          find src tests migrations -name "*.php" -print0 \
            | xargs -0 -n1 -P4 php -l > /tmp/php-lint.log 2>&1 \
            || (cat /tmp/php-lint.log && exit 1)
          tail -n 5 /tmp/php-lint.log || true

      - name: "Install frontend dependencies"
        working-directory: osoma
        run: pnpm install --frozen-lockfile

      - name: "Frontend type check + build"
        working-directory: osoma
        run: pnpm run build

      - name: "Frontend lint"
        working-directory: osoma
        run: pnpm run lint

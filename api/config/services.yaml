        App\ConnectedApps\Apps\SoftMouse\Client\Mock\HttpClientMock:
            decorates: 'soft_mouse.client'
            decoration_inner_name: 'App\ConnectedApps\Apps\SoftMouse\Client\Mock\HttpClientMock.softmouse.client'
            arguments: ['@.inner']
        App\ConnectedApps\Apps\Fair3r\Client\Mock\HttpClientMock:
            decorates: 'fair3r.client'
            decoration_inner_name: 'App\ConnectedApps\Apps\Fair3r\Client\Mock\HttpClientMock.fair3r.client'

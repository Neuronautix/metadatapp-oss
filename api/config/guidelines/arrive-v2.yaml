id: arrive-v2
name: "ARRIVE 2.0"
version: "2.0"
description: "ARRIVE 2.0 reporting guidelines (Essential 10 + Recommended Set) as dataset-level metadata fields, grouped by reporting section."
identifier: "https://arriveguidelines.org"
conforms_to: []
ontology:
  iri: "https://w3id.org/arrive#"
  prefix: "arrive"
fair_bonus:
  dimension: R
  max_points: 5
source: builtin

required_metadata:
  # --- Study details ---
  - id: study_title
    arrive_section: "Study details"
    severity: high
  - id: study_objectives
    arrive_section: "Study details"
    severity: medium
  - id: ethics_statement
    arrive_section: "Study details"
    severity: medium
  - id: protocol_numbers
    arrive_section: "Study details"
    severity: medium
  - id: project_licence
    arrive_section: "Study details"
    severity: medium
  - id: funding_sources
    arrive_section: "Study details"
    severity: low
  - id: conflicts_of_interest
    arrive_section: "Study details"
    severity: low
  - id: protocol_registration
    arrive_section: "Study details"
    severity: low

  # --- Experimental animals ---
  - id: species
    arrive_section: "Experimental animals / Species"
    severity: high
  - id: strain
    arrive_section: "Experimental animals / Strain"
    severity: medium
  - id: sex
    arrive_section: "Experimental animals / Sex"
    severity: high
  - id: age
    arrive_section: "Experimental animals / Age"
    severity: high
  - id: weight
    arrive_section: "Experimental animals / Weight"
    severity: medium
  - id: supplier
    arrive_section: "Experimental animals / Source"
    severity: low
  - id: total_n
    arrive_section: "Experimental animals / Total number"
    severity: high
  - id: genetic_modification
    arrive_section: "Experimental animals / Genetic modification"
    severity: low

  # --- Experimental procedures ---
  - id: procedures_description
    arrive_section: "Experimental procedures"

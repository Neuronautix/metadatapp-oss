  - id: surgical_procedures
    arrive_section: "Experimental procedures / Surgery"
    severity: medium
  - id: anaesthesia
    arrive_section: "Experimental procedures / Anaesthesia"
    severity: medium
  - id: analgesia
    arrive_section: "Experimental procedures / Analgesia"
    severity: medium
  - id: test_substances
    arrive_section: "Experimental procedures / Test substances"
    severity: low
  - id: experimental_groups
    arrive_section: "Study design and sample size / Experimental groups incl. controls"
